<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GP Online Consultation Providers Map</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --ink: #17212b;
      --muted: #607080;
      --line: #d8dee6;
      --accent: #006c7a;
      --shadow: 0 12px 32px rgba(18, 34, 50, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    /*
      Leaflet's CDN stylesheet is still loaded above. These are the critical
      positioning rules that keep tiles and vector overlays aligned if that
      stylesheet is delayed or blocked by the browser/network.
    */
    .leaflet-container {
      overflow: hidden;
      background: #dbe5ec;
      outline-offset: 1px;
      touch-action: none;
    }

    .leaflet-pane,
    .leaflet-tile,
    .leaflet-marker-icon,
    .leaflet-marker-shadow,
    .leaflet-tile-container,
    .leaflet-pane > svg,
    .leaflet-pane > canvas,
    .leaflet-zoom-box,
    .leaflet-image-layer,
    .leaflet-layer {
      position: absolute;
      left: 0;
      top: 0;
    }

    .leaflet-map-pane {
      z-index: auto;
    }

    .leaflet-tile-pane {
      z-index: 200;
    }

    .leaflet-overlay-pane {
      z-index: 400;
    }

    .leaflet-shadow-pane {
      z-index: 500;
    }

    .leaflet-marker-pane {
      z-index: 600;
    }

    .leaflet-tooltip-pane {
      z-index: 650;
    }

    .leaflet-popup-pane {
      z-index: 700;
    }

    .leaflet-tile,
    .leaflet-marker-icon,
    .leaflet-marker-shadow {
      user-select: none;
      -webkit-user-drag: none;
    }

    .leaflet-tile {
      filter: inherit;
      visibility: hidden;
    }

    .leaflet-tile-loaded {
      visibility: inherit;
    }

    .leaflet-zoom-animated {
      transform-origin: 0 0;
    }

    .leaflet-control {
      position: relative;
      z-index: 800;
      pointer-events: auto;
    }

    .leaflet-top,
    .leaflet-bottom {
      position: absolute;
      z-index: 1000;
      pointer-events: none;
    }

    .leaflet-top {
      top: 0;
    }

    .leaflet-right {
      right: 0;
    }

    .leaflet-bottom {
      bottom: 0;
    }

    .leaflet-left {
      left: 0;
    }

    .leaflet-control-zoom {
      margin: 10px;
      border: 2px solid rgba(0, 0, 0, 0.2);
      border-radius: 4px;
      background: #fff;
    }

    .leaflet-control-zoom a {
      display: block;
      width: 30px;
      height: 30px;
      line-height: 30px;
      border-bottom: 1px solid #ccc;
      color: #111;
      text-align: center;
      text-decoration: none;
      font: 700 18px/30px Arial, sans-serif;
    }

    .leaflet-control-zoom a:last-child {
      border-bottom: 0;
    }

    .leaflet-control-attribution {
      margin: 0;
      padding: 2px 6px;
      background: rgba(255, 255, 255, 0.82);
      color: #333;
      font-size: 11px;
    }

    html,
    body {
      height: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .app {
      display: grid;
      grid-template-columns: minmax(290px, 340px) minmax(0, 1fr);
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    .panel {
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-height: 0;
      height: 100%;
      padding: 18px;
      background: var(--panel);
      border-right: 1px solid var(--line);
      box-shadow: var(--shadow);
      z-index: 500;
    }

    .title {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    h1 {
      margin: 0;
      font-size: 1.15rem;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .summary {
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.35;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    button {
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      font-size: 0.9rem;
      font-weight: 650;
    }

    button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .filter-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      padding-top: 2px;
    }

    .section-title {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 750;
      text-transform: uppercase;
    }

    .visible-count {
      color: var(--muted);
      font-size: 0.86rem;
      white-space: nowrap;
    }

    .providers {
      display: grid;
      gap: 8px;
      overflow: auto;
      padding-right: 2px;
    }

    .provider-row {
      display: grid;
      grid-template-columns: 18px 1fr auto;
      align-items: center;
      gap: 9px;
      min-height: 28px;
      color: var(--ink);
      font-size: 0.92rem;
    }

    .provider-row input {
      width: 16px;
      height: 16px;
      margin: 0;
      accent-color: var(--accent);
    }

    .swatch {
      display: inline-block;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      box-shadow: 0 0 0 2px #fff, 0 0 0 3px rgba(23, 33, 43, 0.12);
    }

    .provider-name {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .provider-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .provider-count {
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .legend {
      display: grid;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--line);
    }

    .legend-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 0.86rem;
    }

    .map-wrap {
      min-width: 0;
      height: 100%;
      min-height: 0;
      position: relative;
    }

    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background: #dbe5ec;
    }

    .status {
      position: absolute;
      right: 16px;
      top: 16px;
      max-width: min(420px, calc(100vw - 32px));
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 8px 24px rgba(18, 34, 50, 0.12);
      color: var(--muted);
      font-size: 0.9rem;
      z-index: 450;
    }

    .status:empty {
      display: none;
    }

    .popup {
      display: grid;
      gap: 6px;
      min-width: 220px;
    }

    .popup-title {
      font-weight: 750;
      line-height: 1.25;
    }

    .popup-grid {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 4px 10px;
      color: #243241;
      font-size: 0.88rem;
    }

    .popup-key {
      color: var(--muted);
    }

    @media (max-width: 820px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(230px, 40vh) minmax(0, 1fr);
      }

      .panel {
        height: 100%;
        min-height: 0;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .providers {
        max-height: 22vh;
      }

      .map-wrap,
      #map {
        min-height: 0;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="panel" aria-label="Map controls">
      <div class="title">
        <h1>GP Online Consultation Providers</h1>
        <div id="summary" class="summary">Loading CSV...</div>
      </div>

      <div class="actions">
        <button id="selectAll" type="button">Select all</button>
        <button id="clearAll" type="button">Clear</button>
      </div>

      <div class="filter-head">
        <h2 class="section-title">Providers</h2>
        <span id="visibleCount" class="visible-count"></span>
      </div>
      <div id="providerFilters" class="providers"></div>

      <div class="legend" aria-label="Legend">
        <h2 class="section-title">Legend</h2>
        <div class="legend-row">
          <span><span class="swatch" style="background:#607080"></span> Visible marker</span>
          <span>one practice</span>
        </div>
      </div>
    </aside>

    <section class="map-wrap">
      <div id="map"></div>
      <div id="status" class="status" role="status"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
  <script>
    const DEFAULT_CSV = "oc_provider_most_likely_feb26.csv";
    const PALETTE = [
      "#006c7a", "#d04f2f", "#6a5acd", "#2f8f46", "#c43d77", "#936300",
      "#1685d9", "#7a4d2c", "#4f7f1f", "#b642c2", "#0f7f75", "#d18300",
      "#485cc7", "#a33232", "#348064", "#6e6e1f", "#8b4ec6", "#407087"
    ];
    const COLUMN_ALIASES = {
      name: ["Practice name", "practice name", "name", "GP_NAME", "Practice"],
      code: ["Practice Code", "practice code", "code", "GP_CODE", "GP Code"],
      lat: ["Lat", "lat", "latitude", "Latitude"],
      lon: ["Lon", "lon", "lng", "longitude", "Longitude"],
      provider: [
        "Most likely OC Provider",
        "Online Consultation Provider",
        "online consultation provider",
        "OC Provider",
        "provider",
        "Provider"
      ],
      nhse: ["NHSE OC Provider", "NHSE provider", "National provider"],
      manual: ["Manual OC Provider", "Manual provider"],
      population: ["Practice Population", "population", "Population"]
    };

    let map;
    let markerLayer;
    let practices = [];
    let providerColours = new Map();
    let selectedProviders = new Set();

    const summaryEl = document.getElementById("summary");
    const statusEl = document.getElementById("status");
    const filtersEl = document.getElementById("providerFilters");
    const visibleCountEl = document.getElementById("visibleCount");

    function findColumn(fields, key) {
      const normalized = new Map(fields.map((field) => [field.trim().toLowerCase(), field]));
      for (const alias of COLUMN_ALIASES[key]) {
        const found = normalized.get(alias.trim().toLowerCase());
        if (found) return found;
      }
      return null;
    }

    function getValue(row, column) {
      if (!column) return "";
      const value = row[column];
      return value === undefined || value === null ? "" : String(value).trim();
    }

    function normalizeProvider(value) {
      const text = String(value || "").trim();
      return text || "Unknown";
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function formatNumber(value) {
      const number = Number(String(value || "").replaceAll(",", ""));
      return Number.isFinite(number) ? number.toLocaleString("en-GB") : "";
    }

    function setStatus(message) {
      statusEl.textContent = message || "";
    }

    function providerColour(provider) {
      if (!providerColours.has(provider)) {
        providerColours.set(provider, PALETTE[providerColours.size % PALETTE.length]);
      }
      return providerColours.get(provider);
    }

    function parseRows(rows, sourceName) {
      const fields = rows.meta.fields || [];
      const columns = {
        name: findColumn(fields, "name"),
        code: findColumn(fields, "code"),
        lat: findColumn(fields, "lat"),
        lon: findColumn(fields, "lon"),
        provider: findColumn(fields, "provider"),
        nhse: findColumn(fields, "nhse"),
        manual: findColumn(fields, "manual"),
        population: findColumn(fields, "population")
      };

      const required = ["name", "lat", "lon", "provider"].filter((key) => !columns[key]);
      if (required.length) {
        throw new Error(`Missing required column: ${required.join(", ")}`);
      }

      const nextPractices = rows.data
        .map((row) => {
          const lat = Number(getValue(row, columns.lat));
          const lon = Number(getValue(row, columns.lon));
          return {
            name: getValue(row, columns.name),
            code: getValue(row, columns.code),
            lat,
            lon,
            provider: normalizeProvider(getValue(row, columns.provider)),
            nhse: getValue(row, columns.nhse),
            manual: getValue(row, columns.manual),
            population: getValue(row, columns.population)
          };
        })
        .filter((practice) => practice.name && Number.isFinite(practice.lat) && Number.isFinite(practice.lon));

      if (!nextPractices.length) {
        throw new Error("No usable practice rows found");
      }

      practices = nextPractices;
      providerColours = new Map();
      selectedProviders = new Set(providerList());
      renderFilters();
      renderMarkers();
      summaryEl.textContent = `${nextPractices.length.toLocaleString("en-GB")} practices`;
      setStatus("");
    }

    function providerList() {
      const counts = providerCounts();
      return Array.from(counts.keys()).sort((a, b) => {
        if (a === "Unknown") return 1;
        if (b === "Unknown") return -1;
        return counts.get(b) - counts.get(a) || a.localeCompare(b);
      });
    }

    function providerCounts() {
      const counts = new Map();
      for (const practice of practices) {
        counts.set(practice.provider, (counts.get(practice.provider) || 0) + 1);
      }
      return counts;
    }

    function renderFilters() {
      const counts = providerCounts();
      filtersEl.replaceChildren();

      for (const provider of providerList()) {
        providerColour(provider);
        const label = document.createElement("label");
        label.className = "provider-row";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = selectedProviders.has(provider);
        checkbox.addEventListener("change", () => {
          if (checkbox.checked) selectedProviders.add(provider);
          else selectedProviders.delete(provider);
          renderMarkers();
        });

        const name = document.createElement("span");
        name.className = "provider-name";
        name.innerHTML = `<span class="swatch" style="background:${providerColour(provider)}"></span><span class="provider-label">${escapeHtml(provider)}</span>`;

        const count = document.createElement("span");
        count.className = "provider-count";
        count.textContent = counts.get(provider).toLocaleString("en-GB");

        label.append(checkbox, name, count);
        filtersEl.append(label);
      }
    }

    function popupHtml(practice) {
      const population = formatNumber(practice.population);
      return `
        <div class="popup">
          <div class="popup-title">${escapeHtml(practice.name)}</div>
          <div class="popup-grid">
            ${practice.code ? `<span class="popup-key">Code</span><span>${escapeHtml(practice.code)}</span>` : ""}
            ${population ? `<span class="popup-key">Population</span><span>${population}</span>` : ""}
            <span class="popup-key">Provider</span><span>${escapeHtml(practice.provider)}</span>
            ${practice.nhse ? `<span class="popup-key">NHSE</span><span>${escapeHtml(practice.nhse)}</span>` : ""}
            ${practice.manual ? `<span class="popup-key">Manual</span><span>${escapeHtml(practice.manual)}</span>` : ""}
          </div>
        </div>
      `;
    }

    function renderMarkers() {
      if (!markerLayer) return;
      markerLayer.clearLayers();
      const bounds = [];
      let visible = 0;

      for (const practice of practices) {
        if (!selectedProviders.has(practice.provider)) continue;
        visible += 1;
        const colour = providerColour(practice.provider);
        L.circleMarker([practice.lat, practice.lon], {
          radius: 5,
          color: "#ffffff",
          weight: 1.5,
          fillColor: colour,
          fillOpacity: 0.82
        })
          .bindPopup(popupHtml(practice))
          .addTo(markerLayer);
        bounds.push([practice.lat, practice.lon]);
      }

      visibleCountEl.textContent = `${visible.toLocaleString("en-GB")} visible`;
      requestAnimationFrame(() => {
        map.invalidateSize();
        if (bounds.length) {
          map.fitBounds(bounds, { padding: [28, 28], maxZoom: 11 });
        }
      });
    }

    function loadCsvUrl(url) {
      setStatus("Loading CSV...");
      Papa.parse(url, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: (rows) => {
          try {
            parseRows(rows, url);
          } catch (error) {
            setStatus(error.message);
            summaryEl.textContent = "CSV not loaded";
          }
        },
        error: (error) => {
          setStatus(error.message || "Unable to load CSV");
          summaryEl.textContent = "CSV not loaded";
        }
      });
    }

    document.getElementById("selectAll").addEventListener("click", () => {
      selectedProviders = new Set(providerList());
      renderFilters();
      renderMarkers();
    });

    document.getElementById("clearAll").addEventListener("click", () => {
      selectedProviders = new Set();
      renderFilters();
      renderMarkers();
    });

    function initialize() {
      if (!window.L) {
        summaryEl.textContent = "Map library not loaded";
        setStatus("Leaflet did not load. Check the CDN connection.");
        return;
      }
      if (!window.Papa) {
        summaryEl.textContent = "CSV parser not loaded";
        setStatus("Papa Parse did not load. Check the CDN connection.");
        return;
      }

      map = L.map("map", {
        preferCanvas: true,
        zoomControl: true
      }).setView([52.8, -1.6], 6);

      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
      }).addTo(map);

      markerLayer = L.layerGroup().addTo(map);
      requestAnimationFrame(() => map.invalidateSize());
      loadCsvUrl(DEFAULT_CSV);
    }

    window.addEventListener("resize", () => {
      if (map) requestAnimationFrame(() => map.invalidateSize());
    });

    initialize();
  </script>
</body>
</html>
